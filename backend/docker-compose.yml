services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devrimo
      POSTGRES_PASSWORD: devrimo
      POSTGRES_DB: devrimo
    ports:
      # Host-only. Retrieval is implemented in Postgres, so the test suite and
      # local tooling need a real server to connect to; this must not be
      # published beyond the loopback interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - devrimo-postgres:/var/lib/postgresql/data
    networks:
      - devrimo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrimo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.bootstrap_local"]
    environment:
      ENVIRONMENT: development
      DEVRIMO_ENV_FILE: ""
      DATABASE_URL: postgresql+asyncpg://devrimo:devrimo@postgres:5432/devrimo
    depends_on:
      postgres:
        condition: service_healthy
    networks: [devrimo-internal]

  broker:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: broker
      ACADEMIC_CATALOG_INGESTION_ENABLED: "${ACADEMIC_CATALOG_INGESTION_ENABLED:-false}"
      ACADEMIC_CATALOG_READS_ENABLED: "${ACADEMIC_CATALOG_READS_ENABLED:-false}"
      ACADEMIC_CATALOG_REGISTRATION_START: "${ACADEMIC_CATALOG_REGISTRATION_START:-}"
      ACADEMIC_CATALOG_REGISTRATION_END: "${ACADEMIC_CATALOG_REGISTRATION_END:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      DATABASE_URL: postgresql+asyncpg://devrimo_api_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: api
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: postgresql+asyncpg://devrimo_assistant_local:devrimo_local@postgres:5432/devrimo
      WORKSPACE_GATEWAY_ALLOWED_HOSTS: broker:8000
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      ADMIN_BOOTSTRAP_USER_IDS: "${ADMIN_BOOTSTRAP_USER_IDS:-}"
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
      AGENT_RUNTIME: "${AGENT_RUNTIME:-agno}"
      AGENT_PROFILE: "${AGENT_PROFILE:-scholar}"
      AGENT_MODEL: "${AGENT_MODEL:-muse-spark-1.2-contributor}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_PERSONAL_API_KEY: "${POSTHOG_PERSONAL_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      POSTHOG_INPUT_TOKEN_PRICE: "${POSTHOG_INPUT_TOKEN_PRICE:-0}"
      POSTHOG_OUTPUT_TOKEN_PRICE: "${POSTHOG_OUTPUT_TOKEN_PRICE:-0}"
      # The local .env uses a relative path for non-container development;
      # inside Docker MCP working directories must use the writable volume.
      CAMPUS_MCP_ROOT: "${CAMPUS_MCP_ROOT:-/opt/mcp}"
      CAMPUS_STATE_ROOT: /var/lib/devrimo/campus
      CAMPUS_MCP_TIMEOUT_SECONDS: "${CAMPUS_MCP_TIMEOUT_SECONDS:-30}"
      CAMPUS_SYNC_TIMEOUT_SECONDS: "${CAMPUS_SYNC_TIMEOUT_SECONDS:-120}"
      SAIS_OPTIONAL_READ_SECONDS: "${SAIS_OPTIONAL_READ_SECONDS:-12}"
      CAMPUS_SESSION_IDLE_SECONDS: "${CAMPUS_SESSION_IDLE_SECONDS:-300}"
      CAMPUS_SESSION_MAX_SIZE: "${CAMPUS_SESSION_MAX_SIZE:-256}"
      CAMPUS_CONTEXT_SYNC_ON_CONNECT: "${CAMPUS_CONTEXT_SYNC_ON_CONNECT:-true}"
      COURSE_INFO_SESSION_CACHE: "${COURSE_INFO_SESSION_CACHE:-true}"
      KNOWLEDGE_FETCH_TIMEOUT_SECONDS: "${KNOWLEDGE_FETCH_TIMEOUT_SECONDS:-20}"
      KNOWLEDGE_FETCH_MAX_BYTES: "${KNOWLEDGE_FETCH_MAX_BYTES:-5000000}"
      KNOWLEDGE_FETCH_USER_AGENT: "${KNOWLEDGE_FETCH_USER_AGENT:-DevrimoCampusIndexer/1.0 (+https://devrimo.app)}"
      KNOWLEDGE_EMBEDDING_ENABLED: "${KNOWLEDGE_EMBEDDING_ENABLED:-false}"
      KNOWLEDGE_EMBEDDING_MODEL: "${KNOWLEDGE_EMBEDDING_MODEL:-text-embedding-3-small}"
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}"
      KNOWLEDGE_EMBEDDING_BASE_URL: "${KNOWLEDGE_EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
      KNOWLEDGE_EMBEDDING_API_KEY: "${KNOWLEDGE_EMBEDDING_API_KEY:-}"
      # The Agent is constructed with telemetry=False; this is the second
      # belt. Agno otherwise posts run telemetry to os-api.agno.com, and these
      # runs are students' campus conversations.
      AGNO_TELEMETRY: "false"
      # Trace payloads remain in our database, but production spans still hide
      # user/model text and tool inputs/outputs as a privacy boundary.
      OPENINFERENCE_HIDE_INPUTS: "true"
      OPENINFERENCE_HIDE_OUTPUTS: "true"
      OPENINFERENCE_HIDE_INPUT_MESSAGES: "true"
      OPENINFERENCE_HIDE_OUTPUT_MESSAGES: "true"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - devrimo-internal
    volumes:
      # Integration gateway per-student MCP working directories (CAMPUS_STATE_ROOT). Servers that
      # cache a campus session token relative to their CWD write here, so this
      # has to outlive a container restart or every student re-authenticates
      # to ODTÜClass on every deploy.
      - devrimo-campus-state:/var/lib/devrimo/campus
    # The campus MCP servers are subprocesses of this container, so the limits
    # that used to be per-agent-container now apply to the broker as a whole.
    # CAMPUS_SESSION_MAX_SIZE bounds reusable authenticated integrations;
    # size these together.
    mem_limit: 4g
    pids_limit: 4096
    security_opt:
      - no-new-privileges
    # No Docker socket. The broker no longer creates containers, which removes
    # the host-root-equivalent mount this file used to carry — and lets the
    # image drop to an unprivileged user (see Dockerfile).

  knowledge-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.knowledge.worker"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: knowledge
      DATABASE_URL: postgresql+asyncpg://devrimo_knowledge_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: knowledge
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      KNOWLEDGE_WORKER_POLL_SECONDS: "${KNOWLEDGE_WORKER_POLL_SECONDS:-15}"
      KNOWLEDGE_WORKER_LEASE_SECONDS: "${KNOWLEDGE_WORKER_LEASE_SECONDS:-120}"
      KNOWLEDGE_FETCH_TIMEOUT_SECONDS: "${KNOWLEDGE_FETCH_TIMEOUT_SECONDS:-20}"
      KNOWLEDGE_FETCH_MAX_BYTES: "${KNOWLEDGE_FETCH_MAX_BYTES:-5000000}"
      KNOWLEDGE_FETCH_USER_AGENT: "${KNOWLEDGE_FETCH_USER_AGENT:-DevrimoCampusIndexer/1.0 (+https://devrimo.app)}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]

  agentos:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.agentos.main"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: agentos
      ACADEMIC_CATALOG_READS_ENABLED: "${ACADEMIC_CATALOG_READS_ENABLED:-false}"
      ACADEMIC_CATALOG_REGISTRATION_START: "${ACADEMIC_CATALOG_REGISTRATION_START:-}"
      ACADEMIC_CATALOG_REGISTRATION_END: "${ACADEMIC_CATALOG_REGISTRATION_END:-}"
      DATABASE_URL: postgresql+asyncpg://devrimo_assistant_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: assistant
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      AGENTOS_ENABLED: "true"
      AGENTOS_HOST: "0.0.0.0"
      AGENTOS_PORT: "${AGENTOS_PORT:-7777}"
      AGENTOS_JWT_VERIFICATION_KEY: "${AGENTOS_JWT_VERIFICATION_KEY:-}"
      AGENTOS_JWKS_FILE: "${AGENTOS_JWKS_FILE:-}"
      AGENTOS_JWT_ALGORITHM: "${AGENTOS_JWT_ALGORITHM:-RS256}"
      AGENTOS_JWT_AUDIENCE: "${AGENTOS_JWT_AUDIENCE:-devrimo}"
      AGENTOS_ADMIN_SCOPE: "${AGENTOS_ADMIN_SCOPE:-agentos:admin}"
      AGENTOS_CORS_ORIGINS: "${AGENTOS_CORS_ORIGINS:-https://os.agno.com}"
      AGNO_TELEMETRY: "false"
    ports:
      # Host-only by default. Put this behind authenticated TLS/VPN when the
      # operations UI must reach a remote deployment.
      - "127.0.0.1:7777:7777"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - devrimo-internal
    security_opt:
      - no-new-privileges

  embedding-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.knowledge.embedding_worker"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: embedding
      DATABASE_URL: postgresql+asyncpg://devrimo_embedding_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: embedding
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
      KNOWLEDGE_EMBEDDING_ENABLED: "${KNOWLEDGE_EMBEDDING_ENABLED:-false}"
      KNOWLEDGE_EMBEDDING_MODEL: "${KNOWLEDGE_EMBEDDING_MODEL:-text-embedding-3-small}"
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}"
      KNOWLEDGE_EMBEDDING_BASE_URL: "${KNOWLEDGE_EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
      KNOWLEDGE_EMBEDDING_API_KEY: "${KNOWLEDGE_EMBEDDING_API_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]

  researcher-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runtime", "researcher"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: researcher
      DATABASE_URL: postgresql+asyncpg://devrimo_researcher_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: researcher
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      AVESES_PROXY_URL: "${AVESES_PROXY_URL:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]

  directory-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runtime", "directory"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: directory
      DATABASE_URL: postgresql+asyncpg://devrimo_directory_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: directory
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      ADMIN_DIRECTORY_SYNC_SECONDS: "${ADMIN_DIRECTORY_SYNC_SECONDS:-300}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]

  catalog-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runtime", "catalog"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: catalog
      ACADEMIC_CATALOG_INGESTION_ENABLED: "${ACADEMIC_CATALOG_INGESTION_ENABLED:-false}"
      ACADEMIC_CATALOG_READS_ENABLED: "${ACADEMIC_CATALOG_READS_ENABLED:-false}"
      DATABASE_URL: postgresql+asyncpg://devrimo_catalog_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: catalog
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
      CAMPUS_MCP_ROOT: "${CAMPUS_MCP_ROOT:-/opt/mcp}"
      CAMPUS_STATE_ROOT: /var/lib/devrimo/campus
      CAMPUS_MCP_TIMEOUT_SECONDS: "${CAMPUS_MCP_TIMEOUT_SECONDS:-30}"
      CAMPUS_SYNC_TIMEOUT_SECONDS: "${CAMPUS_SYNC_TIMEOUT_SECONDS:-120}"
      CAMPUS_SESSION_IDLE_SECONDS: "${CAMPUS_SESSION_IDLE_SECONDS:-300}"
      CAMPUS_SESSION_MAX_SIZE: "${CAMPUS_SESSION_MAX_SIZE:-256}"
      COURSE_INFO_SESSION_CACHE: "${COURSE_INFO_SESSION_CACHE:-true}"
      CATALOG_WARM_ENABLED: "${CATALOG_WARM_ENABLED:-true}"
      CATALOG_WARM_INTERVAL_SECONDS: "${CATALOG_WARM_INTERVAL_SECONDS:-20}"
      CATALOG_WARM_JITTER_SECONDS: "${CATALOG_WARM_JITTER_SECONDS:-10}"
      CATALOG_WARM_DAILY_LIMIT: "${CATALOG_WARM_DAILY_LIMIT:-200}"
      CATALOG_WARM_COURSES_PER_PASS: "${CATALOG_WARM_COURSES_PER_PASS:-3}"
      CATALOG_WARM_BATCH: "${CATALOG_WARM_BATCH:-15}"
      CATALOG_WARM_HOURS: "${CATALOG_WARM_HOURS:-1-7}"
      CATALOG_WARM_POLL_SECONDS: "${CATALOG_WARM_POLL_SECONDS:-900}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]
    volumes:
      # Catalog warming keeps a separate per-user state tree from the API
      # gateway, even though both trees are backed by named volumes.
      - devrimo-campus-catalog-state:/var/lib/devrimo/campus

  retention-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runtime", "retention"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: retention
      ACADEMIC_CATALOG_INGESTION_ENABLED: "${ACADEMIC_CATALOG_INGESTION_ENABLED:-false}"
      ACADEMIC_CATALOG_READS_ENABLED: "${ACADEMIC_CATALOG_READS_ENABLED:-false}"
      DATABASE_URL: postgresql+asyncpg://devrimo_catalog_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: catalog
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      SCHEDULE_CACHE_SWEEP_SECONDS: "${SCHEDULE_CACHE_SWEEP_SECONDS:-3600}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]

  assistant-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.assistant.worker"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      RELEASE: "${RELEASE:-}"
      DEVRIMO_ENV_FILE: ""
      DEVRIMO_RUNTIME_COMPONENT: assistant
      ACADEMIC_CATALOG_READS_ENABLED: "${ACADEMIC_CATALOG_READS_ENABLED:-false}"
      ACADEMIC_CATALOG_REGISTRATION_START: "${ACADEMIC_CATALOG_REGISTRATION_START:-}"
      ACADEMIC_CATALOG_REGISTRATION_END: "${ACADEMIC_CATALOG_REGISTRATION_END:-}"
      DATABASE_URL: postgresql+asyncpg://devrimo_assistant_local:devrimo_local@postgres:5432/devrimo
      DATABASE_RUNTIME_ROLE: assistant
      DATABASE_MIGRATION_URL: ""
      ASSISTANT_DATABASE_URL: ""
      WORKSPACE_GATEWAY_URL: http://broker:8000/mcp/
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
      AGENT_RUNTIME: "${AGENT_RUNTIME:-agno}"
      AGENT_PROFILE: "${AGENT_PROFILE:-scholar}"
      AGENT_MODEL: "${AGENT_MODEL:-muse-spark-1.2-contributor}"
      AGENT_OPENAI_BASE_URL: "${AGENT_OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}"
      AGENT_OPENAI_API_KEY: "${AGENT_OPENAI_API_KEY:-}"
      AGENT_MAX_TOKENS: "${AGENT_MAX_TOKENS:-32768}"
      AGENT_HISTORY_RUNS: "${AGENT_HISTORY_RUNS:-10}"
      SCHOLAR_HISTORY_RUNS: "${SCHOLAR_HISTORY_RUNS:-3}"
      AGENT_TOOL_CALL_LIMIT: "${AGENT_TOOL_CALL_LIMIT:-10}"
      AGENT_COMPRESS_TOOL_RESULTS: "${AGENT_COMPRESS_TOOL_RESULTS:-false}"
      AGENT_COMPRESS_TOOL_RESULTS_LIMIT: "${AGENT_COMPRESS_TOOL_RESULTS_LIMIT:-3}"
      AGENT_LEARNING_ENABLED: "${AGENT_LEARNING_ENABLED:-true}"
      AGENT_RETRIES: "${AGENT_RETRIES:-2}"
      AGENT_STORE_EVENTS: "${AGENT_STORE_EVENTS:-false}"
      AGENT_TRACING_ENABLED: "${AGENT_TRACING_ENABLED:-false}"
      ASSISTANT_WORKER_CONCURRENCY: "${ASSISTANT_WORKER_CONCURRENCY:-4}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_PERSONAL_API_KEY: "${POSTHOG_PERSONAL_API_KEY:-}"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-true}"
      POSTHOG_DEBUG: "${POSTHOG_DEBUG:-false}"
      POSTHOG_INPUT_TOKEN_PRICE: "${POSTHOG_INPUT_TOKEN_PRICE:-0}"
      POSTHOG_OUTPUT_TOKEN_PRICE: "${POSTHOG_OUTPUT_TOKEN_PRICE:-0}"
      AGNO_TELEMETRY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    networks: [devrimo-internal]
    security_opt: [no-new-privileges]


networks:
  devrimo-internal:
    # Local development Postgres, API, and independently scoped workers.
    # Production connects all identities to the one Supabase database.
    #
    # Deliberately no egress allowlist here, despite an earlier note in this
    # file saying one belonged here. Compose can express an allowlist only as an
    # HTTP proxy, and an HTTP proxy cannot filter this particular traffic mix:
    #
    #   - webmail speaks IMAP/SMTP (993/465). imaplib and smtplib ignore proxy
    #     environment entirely, so it would pass unfiltered — and it is the one
    #     campus tool that can act as the student rather than just read.
    #   - the other three would not be filtered either. The MCP SDK spawns each
    #     server with only HOME/LOGNAME/PATH/SHELL/TERM/USER inherited, so an
    #     HTTPS_PROXY set here never reaches them at all.
    #
    # Filtering this set means L4, and the broker cannot apply it to itself:
    # nftables needs NET_ADMIN, which would give back the privilege that
    # removing the Docker socket just took away. It belongs on the host, on the
    # FORWARD chain for this bridge. That is deployment configuration, not a
    # promise this file can keep — see "Egress" in README.md for what it is
    # worth and what it does not cover.
    #
    # The name is scoped to the Compose project by default, because a fixed
    # name is actively unsafe with more than one stack on a host. Two stacks
    # sharing a bridge both register the `postgres` alias, so the name resolves
    # to two addresses and each new connection lands on whichever database DNS
    # returns — the pool ends up holding connections to both at once. That
    # reads and writes a student's rows across two databases and surfaces as
    # intermittent 500s rather than as a connection error.
    #
    # Set DEVRIMO_NETWORK_NAME to pin a stable bridge name where a host
    # firewall rule has to reference it, which is the one case that wants a
    # fixed name. Only pin it where a single stack owns the host.
    name: ${DEVRIMO_NETWORK_NAME:-devrimo-${COMPOSE_PROJECT_NAME}-internal}
    driver: bridge

volumes:
  devrimo-postgres:
  devrimo-campus-state:
  devrimo-campus-catalog-state:
