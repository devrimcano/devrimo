name: Deploy production

on:
  push:
    branches: [main]
  # The suite found a broken assertion on a branch that had no checks at all.
  # PRs now run the same verify job; the deploy half stays main-only below.
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs must not queue behind (or block) a production deploy. Pushes keep
  # the one-at-a-time production group; deploys never overlap.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'devrimo-production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # The backend suite runs against a real pgvector service and now takes about
    # eighteen minutes on a normal runner - it has been measured at 17m35s. At
    # twenty the job was a coin flip: a slow runner cancelled the suite mid-run
    # and left main red, which blocks every deploy behind it, for no reason
    # anyone could read off the log.
    timeout-minutes: 35
    services:
      # Retrieval is implemented in Postgres — stemmed full-text search,
      # trigram similarity and pgvector ANN — so the suite needs a real server.
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: devrimo
          POSTGRES_PASSWORD: devrimo
          POSTGRES_DB: devrimo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devrimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # A second of stdlib in front of five minutes of containers, apt, pip and
      # pytest. Everything here fails on reading files alone, and everything
      # here has actually failed: on 2026-09-09 two migrations landed on the
      # same parent and then one carried a revision id too long for the column
      # alembic writes it into, and each of those cost a full backend run to
      # discover, because alembic only says so once it has a database.
      - name: Check migrations and release tooling
        run: |
          python scripts/check_migration_graph.py
          python -m unittest discover -s scripts/tests
          bash -n scripts/deploy-vps.sh

      # The tree predates the Ruff config: 165 findings, almost all long lines
      # in older files. The gate is therefore "no new findings" - lint the
      # Python files this PR changes - so the existing debt can be cleaned on
      # its own schedule instead of blocking every change behind it. The three
      # findings this branch introduced are fixed rather than ignored.
      - name: Lint changed backend files
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}" HEAD -- '*.py' ':(exclude)vendor_patches/*' | sed 's|^backend/||')
          if [ -z "$files" ]; then
            echo "no changed Python files"
            exit 0
          fi
          echo "$files"
          ruff check $files

      - name: Test backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://devrimo:devrimo@localhost:5432/postgres
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python -m pip install -r requirements-dev.txt
          pytest -q
          TEST_EXTENSION_SCHEMA=extensions pytest -q tests/test_database_hardening.py tests/test_database_ownership.py tests/test_restore_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:check
          node --test lib/api/*.test.mjs lib/planning-sync.test.mjs lib/safe-next.test.mjs lib/new-id.test.mjs lib/safe-media-url.test.mjs lib/legal/documents.test.mjs
          npm run lint
          npm run build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: git archive --format=tar.gz --output=devrimo-release.tar.gz HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::VPS_SSH_KEY is not configured"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::VPS_KNOWN_HOSTS is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/devrimo_deploy
          chmod 600 ~/.ssh/devrimo_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The values Next bakes into the browser bundle at build time. They
      # live on the host, in the file systemd already hands the running
      # server, and they are read from there rather than copied into GitHub
      # so that there is one place to change a Supabase key and one answer
      # to what the deployment is configured with. Nothing new is trusted to
      # the runner by doing this: it holds the SSH key to the host already.
      #
      # Only these names are taken. Everything else in that file - and every
      # other file on the host - stays there.
      - name: Read the frontend's build configuration from the host
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          # Retried, for the same reason the upload is: this connection crosses
          # the public internet and it does drop. One run died here on
          # "ssh: connect to host port: Connection timed out" — the whole deploy
          # lost to a network blip, on a step that only reads a file. Retrying a
          # read is free, and this step had been left as the one unprotected
          # crossing while the upload beside it already had three attempts.
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/devrimo_deploy -p "$VPS_PORT" \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "$VPS_USER@$VPS_HOST" \
              "grep -E '^(NEXT_PUBLIC_[A-Z0-9_]+|POSTHOG_PERSONAL_API_KEY|POSTHOG_PROJECT_ID)=' /opt/devrimo/frontend/.env.local" \
              > frontend/.env.local; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not read the build configuration from the host after three attempts"
              exit 1
            fi
            echo "Configuration read attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          # Masked before anything else can echo them. The PostHog personal
          # key is a real secret; the NEXT_PUBLIC ones ship to every browser
          # anyway, and are masked for the sake of not having to think about
          # which is which in a log.
          while IFS='=' read -r _name value; do
            if [ -n "${value:-}" ]; then echo "::add-mask::$value"; fi
          done < frontend/.env.local
          # A build missing these produces a site that loads and cannot sign
          # anyone in, and says nothing about why. Fail here instead.
          grep -q '^NEXT_PUBLIC_SUPABASE_URL=.' frontend/.env.local \
            || { echo '::error::The host did not supply NEXT_PUBLIC_SUPABASE_URL'; exit 1; }
          grep -qE '^NEXT_PUBLIC_SUPABASE_(ANON|PUBLISHABLE)_KEY=.' frontend/.env.local \
            || { echo '::error::The host did not supply a Supabase browser key'; exit 1; }
          echo "read $(wc -l < frontend/.env.local) build variables from the host"

      # The host has two cores and 1.9G of RAM, shared with the API, the
      # workers and a Postgres client, and it was spending most of a deploy
      # on `npm ci` and `next build` - while this runner had already built
      # the same commit in the verify job and thrown the result away. It is
      # built here now, once, and sent.
      - name: Build the frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run build

      # Next traces what the server imports and writes it to .next/standalone;
      # the two things it deliberately leaves out are the browser assets and
      # public/, because it cannot know whether a CDN serves them. Here the
      # Node server serves them, so they go in. Measured: 77M, against the
      # 1.2G release this replaces.
      - name: Bundle the standalone server
        run: |
          set -euo pipefail
          out=frontend/.next/standalone
          test -f "$out/server.js" || { echo '::error::next build produced no standalone server'; exit 1; }
          cp -r frontend/.next/static "$out/.next/static"
          # Guarded: git does not track an empty directory, so a checkout of a
          # tree whose public/ holds nothing has no public/ at all — and an
          # unguarded copy would fail the build for the absence of files it was
          # about to copy none of.
          if [ -d frontend/public ]; then cp -r frontend/public "$out/public"; fi
          # Named so the host can refuse a bundle from a different commit
          # rather than serve one version's pages against another's API.
          printf '%s' "$GITHUB_SHA" > "$out/.built-sha"
          tar -czf devrimo-frontend.tar.gz -C "$out" .
          echo "standalone bundle: $(du -sh "$out" | cut -f1) ($(du -h devrimo-frontend.tar.gz | cut -f1) compressed)"

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_SSH_HOST is not configured"; exit 1; }
          test -n "$VPS_PORT" || { echo "::error::VPS_SSH_PORT is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_SSH_USER is not configured"; exit 1; }
          mv devrimo-release.tar.gz "devrimo-release-${GITHUB_SHA}.tar.gz"
          mv devrimo-frontend.tar.gz "devrimo-frontend-${GITHUB_SHA}.tar.gz"
          # Three of the last eighteen failed runs died here, on the network
          # between GitHub and the host rather than on anything in the change:
          # "connect to host port: Connection timed out" and "client_loop:
          # send disconnect: Broken pipe". Keepalives so an idle moment is not
          # read as a dead link, and two more tries before calling it.
          for attempt in 1 2 3; do
            scp -i ~/.ssh/devrimo_deploy -P "$VPS_PORT" \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              devrimo-release-${GITHUB_SHA}.tar.gz devrimo-frontend-${GITHUB_SHA}.tar.gz \
              "$VPS_USER@$VPS_HOST:/tmp/" && break
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not upload the release to the host after three attempts"
              exit 1
            fi
            echo "Upload attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          # Not retried: this half restarts services and migrates a database,
          # and running it twice because a socket went quiet is worse than
          # failing once. Keepalives only, so a long build is not mistaken for
          # a dead connection - which is how one deploy died mid-npm-install.
          ssh -i ~/.ssh/devrimo_deploy -p "$VPS_PORT" \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA'"\
            " RELEASE_ARCHIVE='/tmp/devrimo-release-${GITHUB_SHA}.tar.gz'"\
            " FRONTEND_ARCHIVE='/tmp/devrimo-frontend-${GITHUB_SHA}.tar.gz' bash -s" \
            < scripts/deploy-vps.sh
