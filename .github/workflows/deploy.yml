name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devrimo-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Retrieval is implemented in Postgres — stemmed full-text search,
      # trigram similarity and pgvector ANN — so the suite needs a real server.
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: devrimo
          POSTGRES_PASSWORD: devrimo
          POSTGRES_DB: devrimo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devrimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://devrimo:devrimo@localhost:5432/postgres
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python -m pip install -r requirements-dev.txt
          pytest -q
          TEST_EXTENSION_SCHEMA=extensions pytest -q tests/test_database_hardening.py tests/test_database_ownership.py tests/test_restore_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:check
          node --test lib/api/*.test.mjs lib/planning-sync.test.mjs
          npm run lint
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: git archive --format=tar.gz --output=devrimo-release.tar.gz HEAD

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::VPS_SSH_KEY is not configured"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::VPS_KNOWN_HOSTS is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/devrimo_deploy
          chmod 600 ~/.ssh/devrimo_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_SSH_HOST is not configured"; exit 1; }
          test -n "$VPS_PORT" || { echo "::error::VPS_SSH_PORT is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_SSH_USER is not configured"; exit 1; }
          scp -i ~/.ssh/devrimo_deploy -P "$VPS_PORT" \
            devrimo-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/devrimo-release-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/devrimo_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' RELEASE_ARCHIVE='/tmp/devrimo-release-${GITHUB_SHA}.tar.gz' bash -s" \
            < scripts/deploy-vps.sh
